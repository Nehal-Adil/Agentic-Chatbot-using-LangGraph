[project]
name = "agentic-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nehal Adil", email = "mdnehaladil@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-chatbot = "agentic_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
